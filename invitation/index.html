<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演唱会门票</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .ticket-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .ticket-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4facfe, #00f2fe, #43e97b, #38f9d7);
        }

        .header {
            margin-bottom: 30px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title-small {
            font-size: 12px;
            color: #b8c5d6;
            margin: 5px 0;
        }

        .title-large {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: #b8c5d6;
            margin-bottom: 20px;
        }

        .content {
            margin-bottom: 30px;
        }

        .concert-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .concert-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .concert-details {
            font-size: 14px;
            line-height: 1.6;
        }

        .date-time {
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .location {
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .special-message {
            color: #e8f4fd;
            line-height: 1.6;
            margin-bottom: 20px;
            font-style: italic;
        }

        .cta-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #43e97b, #38f9d7);
            color: #1a1a2e;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #b8c5d6;
            font-size: 14px;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 25px;
            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .ticket-number {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            color: #ffffff;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .star-icon {
            font-size: 20px;
            margin: 0 3px;
        }

        @media (max-width: 480px) {
            .ticket-card {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .cta-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }

        .floating-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="floating-stars" id="stars"></div>
    
    <a href="/" class="back-link">← 返回博客</a>
    
    <div class="ticket-card">
        <div class="ticket-number">VIP-001 子晶</div>
        
        <div class="header">
            <h1 class="title">周杰伦、五月天、林俊杰</h1>
            <p class="title-small">翻唱版</p>
            <h1 class="title-large">世界巡回演唱会</h1>
        </div>
        
        <div class="content">
            <div class="concert-info">
                <div class="concert-title">🌟 专属音乐时光</div>
                <div class="concert-details">
                    <div class="date-time">
                        <span style="color: #ffeb3b; font-weight: bold;">任意周末晚上</span>
                    </div>
                    <div class="location">
                        地点：<span style="color: #ffeb3b; font-weight: bold;">鸟巢体育馆(KTV版)</span><br>
                        歌手：<span style="color: #ffeb3b; font-weight: bold;">方方土(真人版)</span>
                    </div>
                </div>
            </div>
            
            <div class="special-message">
                <span class="star-icon">⭐</span>
                独一无二的音乐盛宴！<br>
                Just for you!
                <span class="star-icon">⭐</span>
            </div>
        </div>
        
        <div class="footer">
            <p>🎵 VIP门票</p>
            <p>PS: 没有退票服务哦</p>
        </div>
    </div>

    <script>
        // 创建浮动星星效果
        function createStar() {
            const star = document.createElement('div');
            star.className = 'star';
            const stars = ['⭐', '✨', '🌟', '💫', '⭐'];
            star.innerHTML = stars[Math.floor(Math.random() * stars.length)];
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDuration = (Math.random() * 3 + 3) + 's';
            star.style.fontSize = (Math.random() * 20 + 10) + 'px';
            
            document.getElementById('stars').appendChild(star);
            
            // 动画结束后移除元素
            setTimeout(() => {
                star.remove();
            }, 6000);
        }

        // 每2秒创建一个星星
        setInterval(createStar, 2000);
        
        // 页面加载时创建几个星星
        for (let i = 0; i < 5; i++) {
            setTimeout(createStar, i * 500);
        }
    </script>
</body>
</html>
